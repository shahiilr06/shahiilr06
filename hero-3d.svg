<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0B0D14"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="#05060A"/>
  <circle cx="400" cy="150" r="150" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#E0E7FF">
    <circle cx="90" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="230" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="50" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="220" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="35" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="265" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(400 150)">
    <!-- orbit 1: tilted, clockwise -->
    <g transform="rotate(-18)">
      <ellipse rx="230" ry="70" fill="none" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle r="5" fill="#2DD4BF">
        <animateMotion dur="14s" repeatCount="indefinite" path="M -230,0 A 230,70 0 1,0 230,0 A 230,70 0 1,0 -230,0"/>
      </circle>
    </g>

    <!-- orbit 2: steep, counter-clockwise -->
    <g transform="rotate(40)">
      <ellipse rx="170" ry="120" fill="none" stroke="#2DD4BF" stroke-opacity="0.3" stroke-width="1"/>
      <circle r="4" fill="#A5B4FC">
        <animateMotion dur="10s" repeatCount="indefinite" path="M -170,0 A 170,120 0 1,1 170,0 A 170,120 0 1,1 -170,0"/>
      </circle>
    </g>

    <!-- orbit 3: flat, slow -->
    <g transform="rotate(8)">
      <ellipse rx="290" ry="40" fill="none" stroke="#818CF8" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>
      <circle r="3.5" fill="#E0E7FF">
        <animateMotion dur="18s" repeatCount="indefinite" path="M -290,0 A 290,40 0 1,0 290,0 A 290,40 0 1,0 -290,0"/>
      </circle>
    </g>

    <!-- core -->
    <circle r="46" fill="url(#core)">
      <animate attributeName="r" values="44;48;44" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="62" fill="none" stroke="#6366F1" stroke-opacity="0.35">
      <animate attributeName="r" values="60;72;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
